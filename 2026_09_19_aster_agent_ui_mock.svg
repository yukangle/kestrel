  <text x="1068" y="320" class="font small text">packages/protocol/events.ts</text>
  <text x="1360" y="320" class="font small" fill="#34d399">+42</text>
  <text x="1068" y="348" class="font small text">packages/agent-core/session.ts</text>
  <text x="1360" y="348" class="font small" fill="#34d399">+31</text>
  <text x="1068" y="376" class="font small text">apps/cli/commands/run.ts</text>
  <text x="1360" y="376" class="font small" fill="#f87171">−12</text>
  <line x1="1068" y1="398" x2="1392" y2="398" stroke="#26354d"/>
  <text x="1068" y="420" class="font tiny muted">Reviewable patch · not applied</text>
  <text x="1050" y="477" class="font label muted">MODEL &amp; POLICY</text>
  <rect x="1048" y="493" width="174" height="68" rx="9" fill="#111d32"/>
  <text x="1068" y="518" class="font tiny muted">MODEL</text>
  <text x="1068" y="542" class="font small text">Claude Sonnet</text>
  <rect x="1238" y="493" width="174" height="68" rx="9" fill="#111d32"/>
  <text x="1258" y="518" class="font tiny muted">POLICY</text>
  <text x="1258" y="542" class="font small" fill="#fcd34d">Review</text>
  <text x="1050" y="602" class="font label muted">VALIDATION</text>
  <rect x="1048" y="618" width="364" height="96" rx="9" fill="#111d32"/>
  <circle cx="1072" cy="645" r="6" fill="#94a3b8"/>
  <text x="1090" y="650" class="font small text">Tests pending approval</text>
  <circle cx="1072" cy="674" r="6" fill="#34d399"/>
  <text x="1090" y="679" class="font small text">Workspace boundary verified</text>
  <circle cx="1072" cy="703" r="6" fill="#34d399"/>
  <text x="1090" y="708" class="font small text">Secret redaction enabled</text>
  <text x="1050" y="758" class="font label muted">RUNTIME</text>
  <rect x="1048" y="774" width="364" height="58" rx="9" fill="#111d32"/>
  <circle cx="1072" cy="803" r="7" fill="#22c55e"/>
  <text x="1090" y="808" class="font small text">Local runner · ready</text>
  <text x="1290" y="808" class="font tiny muted">0.8s</text>

  <!-- Footer -->
  <rect x="260" y="868" width="1180" height="32" fill="#0b1220"/>
  <text x="282" y="889" class="font tiny muted">Aster v0.1 · session 8e2a · local-first · ⌘P command palette</text>
  <text x="1290" y="889" class="font tiny" fill="#34d399">● connected</text>
