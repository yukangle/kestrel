<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Aster personal AI coding agent desktop UI mockup</title>
  <desc id="desc">A dark Electron desktop interface with session navigation, an agent conversation, tool activity, approvals, a diff preview, and model controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .muted { fill: #94a3b8; }
      .text { fill: #e5e7eb; }
      .tiny { font-size: 11px; }
      .small { font-size: 13px; }
      .body { font-size: 14px; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1440" height="42" fill="#0b1220"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="40" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="6" fill="#22c55e"/>
  <text x="88" y="26" class="font small muted">Aster · Personal Agent</text>
  <text x="1310" y="26" class="font small muted">⌘ K</text>
  <circle cx="1388" cy="21" r="12" fill="#334155"/>
  <text x="1382" y="25" class="font tiny text">TY</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="260" height="858" fill="#0d1525" stroke="#1e293b"/>
  <rect x="18" y="62" width="224" height="40" rx="9" fill="#17233a" stroke="#334155"/>
  <circle cx="38" cy="82" r="9" fill="url(#accent)"/>
  <text x="57" y="87" class="font body text">New session</text>
  <text x="215" y="87" class="font body muted">⌘N</text>
  <text x="20" y="136" class="font label muted">WORKSPACE</text>
  <rect x="18" y="148" width="224" height="42" rx="8" fill="#111d32"/>
  <text x="34" y="174" class="font body text">⌂  ~/Developer/ai</text>
  <text x="218" y="174" class="font body muted">⌄</text>
  <text x="20" y="226" class="font label muted">SESSIONS</text>
  <rect x="12" y="239" width="236" height="62" rx="9" fill="#25204a" stroke="#6d5bd0"/>
  <circle cx="31" cy="260" r="5" fill="#22d3ee"/>
  <text x="46" y="260" class="font small text">Design agent runtime</text>
  <text x="46" y="280" class="font tiny muted">Today · 14 tool events</text>
  <text x="20" y="326" class="font small muted">○  Compare Goose and Cline</text>
  <text x="20" y="363" class="font small muted">✓  Add provider adapter</text>
  <text x="20" y="400" class="font small muted">○  Review Electron security</text>
  <text x="20" y="437" class="font small muted">○  Build repository map</text>
  <text x="20" y="486" class="font label muted">VIEWS</text>
  <text x="20" y="520" class="font small muted">▦  Changes</text>
  <text x="20" y="557" class="font small muted">◫  Command history</text>
  <text x="20" y="594" class="font small muted">⚙  Settings</text>
  <rect x="18" y="824" width="224" height="52" rx="9" fill="#111d32"/>
  <circle cx="39" cy="850" r="8" fill="#22c55e"/>
  <text x="57" y="847" class="font small text">Local runtime ready</text>
  <text x="57" y="864" class="font tiny muted">Ollama · sandbox off</text>

  <!-- Main header -->
  <rect x="260" y="42" width="1180" height="62" fill="#101a2d" stroke="#1e293b"/>
  <text x="292" y="70" class="font body text">Design agent runtime</text>
  <text x="292" y="89" class="font tiny muted">~/Developer/ai · branch: main · 3 files changed</text>
  <rect x="1040" y="58" width="94" height="30" rx="7" fill="#17233a"/>
  <text x="1058" y="78" class="font small text">Review mode</text>
  <text x="1119" y="78" class="font small muted">⌄</text>
  <rect x="1146" y="58" width="122" height="30" rx="7" fill="#17233a"/>
  <circle cx="1165" cy="73" r="6" fill="#a78bfa"/>
  <text x="1178" y="78" class="font small text">Claude Sonnet</text>
  <text x="1251" y="78" class="font small muted">⌄</text>
  <circle cx="1300" cy="73" r="14" fill="#17233a" stroke="#334155"/>
  <text x="1294" y="78" class="font body muted">⋯</text>

  <!-- Conversation -->
  <rect x="260" y="104" width="760" height="796" fill="#0f172a"/>
  <text x="300" y="145" class="font label muted">SESSION TIMELINE</text>
  <line x1="300" y1="164" x2="980" y2="164" stroke="#1e293b"/>
  <circle cx="326" cy="204" r="16" fill="#263456"/>
  <text x="318" y="209" class="font small text">TY</text>
  <text x="358" y="201" class="font small text">Map the runtime boundary and propose the first vertical slice.</text>
  <text x="358" y="222" class="font tiny muted">2:18 PM · user request</text>

  <rect x="300" y="252" width="680" height="124" rx="10" fill="#141f34" stroke="#293955"/>
  <circle cx="327" cy="280" r="14" fill="url(#accent)"/>
  <text x="320" y="285" class="font body" fill="#fff">✦</text>
  <text x="354" y="283" class="font body text">Plan</text>
  <text x="354" y="308" class="font small text">I’ll separate the client, protocol, runtime, tools, and policy layers.</text>
  <text x="354" y="332" class="font small muted">Next: inspect package boundaries, then write the event contract.</text>
  <rect x="354" y="348" width="88" height="20" rx="5" fill="#1f3b45"/>
  <text x="366" y="362" class="font tiny" fill="#67e8f9">read-only</text>

  <rect x="300" y="399" width="680" height="86" rx="10" fill="#101a2d" stroke="#26354d"/>
  <circle cx="327" cy="427" r="14" fill="#1d4ed8"/>
  <text x="320" y="432" class="font body" fill="#fff">⌕</text>
  <text x="354" y="430" class="font body text">Search repository</text>
  <text x="354" y="454" class="font small muted mono">grep · packages/agent-core · 12 matches</text>
  <text x="875" y="430" class="font tiny" fill="#34d399">done</text>

  <rect x="300" y="506" width="680" height="108" rx="10" fill="#101a2d" stroke="#26354d"/>
  <circle cx="327" cy="534" r="14" fill="#7c3aed"/>
  <text x="320" y="539" class="font body" fill="#fff">✎</text>
  <text x="354" y="537" class="font body text">Proposed changes</text>
  <text x="354" y="561" class="font small muted">3 files · +86 −12 · review before applying</text>
  <rect x="354" y="577" width="112" height="23" rx="5" fill="#35255f"/>
  <text x="368" y="593" class="font tiny" fill="#c4b5fd">Open diff</text>
  <rect x="478" y="577" width="102" height="23" rx="5" fill="#17233a"/>
  <text x="491" y="593" class="font tiny text">Reject</text>

  <rect x="300" y="637" width="680" height="82" rx="10" fill="#39251a" stroke="#8a5a2e"/>
  <circle cx="327" cy="665" r="14" fill="#f59e0b"/>
  <text x="322" y="670" class="font body" fill="#111827">!</text>
  <text x="354" y="668" class="font body text">Approval required</text>
  <text x="354" y="691" class="font small" fill="#fcd34d">Run `pnpm test` in this workspace?</text>
  <rect x="858" y="653" width="58" height="26" rx="6" fill="#f59e0b"/>
  <text x="873" y="670" class="font tiny" fill="#111827">Allow</text>
  <rect x="922" y="653" width="42" height="26" rx="6" fill="#17233a"/>
  <text x="931" y="670" class="font tiny text">No</text>

  <rect x="300" y="756" width="680" height="104" rx="12" fill="#141f34" stroke="#334155"/>
  <text x="320" y="786" class="font small muted">Ask Aster to continue…</text>
  <text x="320" y="828" class="font tiny muted">↩ send    ⌘↩ send and approve    @ mention file    / commands</text>
  <circle cx="946" cy="820" r="20" fill="url(#accent)"/>
  <text x="938" y="827" class="font body" fill="#fff">↑</text>

  <!-- Inspector -->
  <rect x="1020" y="104" width="420" height="796" fill="#0d1525" stroke="#1e293b"/>
  <text x="1050" y="145" class="font label muted">INSPECTOR</text>
  <rect x="1048" y="164" width="364" height="74" rx="9" fill="#111d32"/>
