<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Kestrel current architecture</title>
  <desc id="desc">Architecture diagram showing the CLI and Electron clients calling the shared AgentRuntime through the protocol, with workspace inspection and deterministic mock provider dependencies.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 15px; }
      .section { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .box { fill: #111d32; stroke: #334155; stroke-width: 1.5; }
      .box-accent { fill: #14243e; stroke: #38bdf8; stroke-width: 1.5; }
      .box-green { fill: #12271f; stroke: #34d399; stroke-width: 1.5; }
      .box-muted { fill: #111827; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .label { fill: #e5e7eb; font-size: 18px; font-weight: 700; }
      .body { fill: #cbd5e1; font-size: 14px; }
      .small { fill: #94a3b8; font-size: 12px; }
      .line { fill: none; stroke: #67e8f9; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-muted { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="980" fill="url(#background)"/>
  <text x="70" y="68" class="font title">Kestrel — current architecture</text>
  <text x="70" y="96" class="font subtitle">Local-first Phase 1 vertical slice · shared TypeScript runtime · deterministic mock provider</text>

  <text x="70" y="145" class="font section">CLIENTS</text>
  <rect x="70" y="170" width="400" height="170" rx="16" class="box" filter="url(#shadow)"/>
  <text x="100" y="212" class="font label">CLI client</text>
  <text x="100" y="242" class="font body">src/cli.ts</text>
  <text x="100" y="270" class="font body">plan · run · --json · --workspace</text>
  <text x="100" y="300" class="font small">TTY output or versioned JSONL events</text>

  <rect x="520" y="170" width="400" height="170" rx="16" class="box" filter="url(#shadow)"/>
  <text x="550" y="212" class="font label">Electron desktop client</text>
  <text x="550" y="242" class="font body">main · preload · renderer</text>
  <text x="550" y="270" class="font body">workspace · mode · task · live timeline</text>
  <text x="550" y="300" class="font small">Secure renderer: sandbox + context isolation</text>

  <rect x="970" y="170" width="460" height="170" rx="16" class="box-muted" filter="url(#shadow)"/>
  <text x="1000" y="212" class="font label">Design mockup</text>
  <text x="1000" y="242" class="font body">2026_09_19_aster_agent_ui_mock.svg</text>
  <text x="1000" y="270" class="font body">Reference only — not the current implementation</text>
  <text x="1000" y="300" class="font small">Approvals, diffs, inspector, and session rail are future UI</text>

  <text x="70" y="410" class="font section">HOST BOUNDARY AND PROTOCOL</text>
  <rect x="70" y="435" width="400" height="170" rx="16" class="box-accent" filter="url(#shadow)"/>
  <text x="100" y="478" class="font label">Electron main process</text>
  <text x="100" y="508" class="font body">src/electron/main.ts</text>
  <text x="100" y="536" class="font body">IPC: session.start / session.event</text>
  <text x="100" y="566" class="font small">Validates request and forwards runtime events</text>

  <rect x="520" y="435" width="400" height="170" rx="16" class="box-accent" filter="url(#shadow)"/>
  <text x="550" y="478" class="font label">Preload bridge</text>
  <text x="550" y="508" class="font body">src/electron/preload.cjs</text>
  <text x="550" y="536" class="font body">contextBridge → window.kestrel</text>
  <text x="550" y="566" class="font small">Narrow API; no direct filesystem or shell access</text>

  <rect x="970" y="435" width="460" height="170" rx="16" class="box" filter="url(#shadow)"/>
  <text x="1000" y="478" class="font label">Shared protocol types</text>
  <text x="1000" y="508" class="font body">src/protocol.ts</text>
  <text x="1000" y="536" class="font body">SessionMode · AgentEvent · AgentProvider</text>
  <text x="1000" y="566" class="font small">Typed contract shared by CLI, Electron, and runtime</text>

  <text x="70" y="675" class="font section">SHARED RUNTIME</text>
  <rect x="70" y="700" width="600" height="190" rx="16" class="box-green" filter="url(#shadow)"/>
  <text x="100" y="745" class="font label">AgentRuntime</text>
  <text x="100" y="775" class="font body">src/core.ts</text>
  <text x="100" y="803" class="font body">Creates session → summarizes workspace → calls provider</text>
  <text x="100" y="831" class="font body">Emits started, tool, assistant, completed, and failed events</text>
  <text x="100" y="861" class="font small">No writes, shell commands, persistence, or network calls</text>

  <rect x="770" y="700" width="300" height="190" rx="16" class="box" filter="url(#shadow)"/>
  <text x="800" y="745" class="font label">Workspace inspection</text>
  <text x="800" y="775" class="font body">summarizeWorkspace()</text>
  <text x="800" y="803" class="font body">Top-level entries only</text>
  <text x="800" y="831" class="font body">Skips dotfiles and node_modules</text>
  <text x="800" y="861" class="font small">Reads directory metadata only</text>

  <rect x="1170" y="700" width="260" height="190" rx="16" class="box" filter="url(#shadow)"/>
  <text x="1200" y="745" class="font label">MockProvider</text>
  <text x="1200" y="775" class="font body">Deterministic local output</text>
  <text x="1200" y="803" class="font body">Task-sensitive templates</text>
  <text x="1200" y="831" class="font body">No API key required</text>
  <text x="1200" y="861" class="font small">Implements AgentProvider</text>

  <path d="M 270 340 L 270 435" class="line"/>
  <path d="M 720 340 L 720 435" class="line"/>
  <path d="M 470 520 L 520 520" class="line"/>
  <path d="M 920 520 L 970 520" class="line"/>
  <path d="M 720 605 L 520 700" class="line"/>
  <path d="M 670 795 L 770 795" class="line"/>
  <path d="M 1070 795 L 1170 795" class="line"/>
  <path d="M 470 255 C 500 255 490 520 470 520" class="line"/>
  <path d="M 520 285 C 500 285 490 540 470 540" class="line"/>
  <path d="M 920 255 C 945 255 945 520 920 520" class="line-muted"/>

  <text x="70" y="940" class="font small">Solid arrows = implemented runtime path · dashed arrow/boxes = design reference or future surface</text>
</svg>
